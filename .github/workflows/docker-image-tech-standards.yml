name: Build And Upload Image For Tech Standards
on:
  push:
    branches:
      - tech-standards/main
    tags:
      - 'tech-standards/*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # 如果是 tag 触发，使用 tag 名称作为版本
            TAG_NAME=${GITHUB_REF#refs/tags/}
            echo "VERSION_TAG=${TAG_NAME}" >> $GITHUB_ENV
            echo "VERSION=${TAG_NAME}" >> $GITHUB_ENV
          else
            # 如果是分支触发，使用分支名+日期+commit
            echo "VERSION_TAG=tech-standards" >> $GITHUB_ENV
            echo "VERSION=tech-standards-$(date +%Y%m%d)-${GITHUB_SHA:0:7}" >> $GITHUB_ENV
          fi
          echo "COMMIT_ID=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_ENV

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: ./Dockerfile.tech-standards
          platforms: |
            linux/amd64
            linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/moments:${{ env.VERSION_TAG }}
            ghcr.io/${{ github.repository_owner }}/moments:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT_ID=${{ env.COMMIT_ID }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Image Tags
        run: |
          echo "✅ Image built and pushed with tags:"
          echo "  - ghcr.io/${{ github.repository_owner }}/moments:tech-standards"
          echo "  - ghcr.io/${{ github.repository_owner }}/moments:${{ env.VERSION }}"

      - name: Image Summary
        run: |
          echo "✅ Image built successfully!"
          echo ""
          echo "📦 Image Tags:"
          echo "  - ghcr.io/${{ github.repository_owner }}/moments:tech-standards"
          echo "  - ghcr.io/${{ github.repository_owner }}/moments:${{ env.VERSION }}"
          echo ""
          echo "🚀 To pull and run:"
          echo "  docker pull ghcr.io/${{ github.repository_owner }}/moments:tech-standards"
          echo "  docker run -p 3001:3001 ghcr.io/${{ github.repository_owner }}/moments:tech-standards"

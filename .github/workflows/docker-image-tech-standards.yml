name: Build And Upload Image For Tech Standards
on:
  push:
    branches:
      - tech-standards/main
    tags:
      - 'tech-standards/*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Version
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tech-standards" >> $GITHUB_ENV
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/tech-standards/}
            echo "VERSION=${TAG_NAME}" >> $GITHUB_ENV
          else
            echo "VERSION=latest" >> $GITHUB_ENV
          fi
          echo "COMMIT_ID=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_ENV

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: ./Dockerfile.tech-standards
          platforms: |
            linux/amd64
            linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.IMAGE_NAME }}:${{ env.COMMIT_ID }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT_ID=${{ env.COMMIT_ID }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Image Tags
        run: |
          echo "✅ Image built and pushed with tags:"
          echo "  - ${{ env.IMAGE_NAME }}:${{ env.VERSION }}"
          echo "  - ${{ env.IMAGE_NAME }}:${{ env.COMMIT_ID }}"

      - name: Image Summary
        run: |
          echo "✅ Image built successfully!"
          echo ""
          echo "📦 Image Tags:"
          echo "  - ${{ env.IMAGE_NAME }}:${{ env.VERSION }}"
          echo "  - ${{ env.IMAGE_NAME }}:${{ env.COMMIT_ID }}"
          echo ""
          echo "🚀 To pull and run:"
          echo "  docker pull ${{ env.IMAGE_NAME }}:${{ env.VERSION }}"

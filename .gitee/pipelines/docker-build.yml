version: '1.0'
name: docker-build-push
displayName: '构建并推送Docker镜像'

triggers:
  trigger: auto
  push:
    branches:
      prefix:
        - moments-plus/main

variables:
  REGISTRY: 'crpi-wcwep2opqtm0wq85.cn-shenzhen.personal.cr.aliyuncs.com'
  NAMESPACE: 'private_image_repositor'
  IMAGE_NAME: 'moments'

stages:
  - name: stage-build
    displayName: '构建推送'
    strategy: naturally

steps:
  - step: build@1
    name: build_job
    displayName: '构建并推送Docker镜像'
    stage: stage-build
    machine:
      class: C2
      image: latest
    commands:
      - |
        # 版本号处理
        if [[ "$GITEE_REF" == refs/tags/v* ]]; then
          VERSION="${GITEE_REF#refs/tags/v}"
        else
          VERSION="$(echo $GITEE_COMMIT_SHA | cut -c1-7)"
        fi

        FULL_IMAGE=${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}

        echo "🚀 开始构建镜像，版本: ${VERSION}"
        echo "📦 目标仓库: ${FULL_IMAGE}"

        # 登录阿里云容器镜像服务
        echo "${{ credentials.aliyun-cr.password }}" | docker login -u "${{ credentials.aliyun-cr.username }}" ${REGISTRY} --password-stdin

        # 构建镜像
        docker build \
          --build-arg VERSION="${VERSION}" \
          --build-arg COMMIT_ID="${GITEE_COMMIT_SHA}" \
          -t ${FULL_IMAGE}:latest \
          -t ${FULL_IMAGE}:${VERSION} \
          .

        # 推送镜像
        docker push ${FULL_IMAGE}:latest
        docker push ${FULL_IMAGE}:${VERSION}

        echo "✅ 镜像推送完成: ${FULL_IMAGE}:latest, ${FULL_IMAGE}:${VERSION}"

version: '1.0'
name: docker-build-push
displayName: '构建并推送Docker镜像'

triggers:
  trigger: auto
  push:
    branches:
      prefix:
        - moments-plus/main

variables:
  REGISTRY: 'crpi-wcwep2opqtm0wq85.cn-shenzhen.personal.cr.aliyuncs.com'
  NAMESPACE: 'private_image_repositor'
  IMAGE_NAME: 'moments'

stages:
  - name: stage-build
    displayName: '构建推送'
    strategy: naturally

steps:
  - step: exec@1
    name: build_job
    displayName: '构建并推送Docker镜像'
    stage: stage-build
    machine:
      class: C2
      image: latest
    commands:
      - |
        # 配置 Docker 镜像加速（解决国内无法访问 docker.io 的问题）
        mkdir -p /etc/docker
        cat > /etc/docker/daemon.json <<EOF
        {
          "registry-mirrors": [
            "https://docker.1ms.run",
            "https://docker.xuanyuan.me",
            "https://docker.m.daocloud.io"
          ]
        }
        EOF
        
        # 重启 Docker 服务使加速配置生效
        service docker restart || dockerd &
        sleep 5
        
        # 版本号处理
        VERSION="$(echo $GITEE_COMMIT_SHA | cut -c1-7)"
        FULL_IMAGE=${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}
        
        echo "🚀 开始构建镜像，版本: ${VERSION}"
        echo "📦 目标仓库: ${FULL_IMAGE}"
        
        # 登录阿里云容器镜像服务
        echo "${{ credentials.aliyun-cr.password }}" | docker login -u "${{ credentials.aliyun-cr.username }}" ${REGISTRY} --password-stdin
        
        # 构建镜像
        docker build \
          --build-arg VERSION="${VERSION}" \
          --build-arg COMMIT_ID="${GITEE_COMMIT_SHA}" \
          -t ${FULL_IMAGE}:latest \
          -t ${FULL_IMAGE}:${VERSION} \
          .
        
        # 推送镜像
        docker push ${FULL_IMAGE}:latest
        docker push ${FULL_IMAGE}:${VERSION}
        
        echo "✅ 镜像推送完成"

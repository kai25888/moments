version: '1.0'
name: docker-build-push
displayName: '构建并推送Docker镜像'

triggers:
  trigger: auto
  push:
    branches:
      prefix:
        - moments-plus/main

variables:
  REGISTRY: 'crpi-wcwep2opqtm0wq85.cn-shenzhen.personal.cr.aliyuncs.com'
  NAMESPACE: 'private_image_repositor'
  IMAGE_NAME: 'moments'

stages:
  - name: stage-build
    displayName: '构建推送'
    strategy: naturally

steps:
  - step: build@1
    name: build_job
    displayName: '构建并推送Docker镜像'
    stage: stage-build
    machine:
      class: C2
      image: latest
    with:
      dockerRepo: '${REGISTRY}'
      dockerImageTag: '${GITEE_COMMIT_SHA:0:7}'
      dockerfile: './Dockerfile'

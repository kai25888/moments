<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片网格测试</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .full-cover-image-mult {
      width: 100%;
      height: 0;
      padding-bottom: 100%;
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      background: #e5e7eb;
    }

    .full-cover-image-mult img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body class="bg-gray-100 p-4">
  <div class="max-w-md mx-auto">
    <h2 class="text-lg font-bold mb-4">图片网格测试（3张图）</h2>
    <div class="grid grid-cols-3 gap-1">
      <div class="full-cover-image-mult">
        <img src="/微信图片_20260416173623_914_29.jpg" alt="图片1" />
      </div>
      <div class="full-cover-image-mult">
        <img src="/微信图片_20260416173624_915_29.jpg" alt="图片2" />
      </div>
      <div class="full-cover-image-mult">
        <img src="/微信图片_20260416173625_916_29.jpg" alt="图片3" />
      </div>
    </div>

    <h2 class="text-lg font-bold mb-4 mt-6">图片网格测试（4张图）</h2>
    <div class="grid grid-cols-4 gap-1">
      <div class="full-cover-image-mult">
        <img src="/微信图片_20260416173623_914_29.jpg" alt="图片1" />
      </div>
      <div class="full-cover-image-mult">
        <img src="/微信图片_20260416173624_915_29.jpg" alt="图片2" />
      </div>
      <div class="full-cover-image-mult">
        <img src="/微信图片_20260416173625_916_29.jpg" alt="图片3" />
      </div>
      <div class="full-cover-image-mult">
        <img src="/微信图片_20260416173623_914_29.jpg" alt="图片4" />
      </div>
    </div>
  </div>
</body>
</html>

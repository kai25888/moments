# Moments-Fork Nginx 配置
# 路径: /etc/nginx/conf.d/moments.conf
# 或放到 Nginx 配置目录后软链接

server {
    listen 11307;
    server_name _;

    # 字符集
    charset utf-8;

    # 日志
    access_log /var/log/nginx/moments_access.log;
    error_log /var/log/nginx/moments_error.log;

    # 上传文件大小限制
    client_max_body_size 100M;

    # 根目录
    root /app/backend;
    index index.html;

    # API 代理到后端
    location /api/ {
        proxy_pass http://127.0.0.1:37892;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 上传文件 - 启用缓存
    location /upload/ {
        # 启用 gzip 压缩
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types image/jpeg image/jpg image/webp image/avif image/png image/gif;
        gzip_min_length 1000;

        # 缓存控制
        expires 7d;
        add_header Cache-Control "public, max-age=604800";

        # 添加缓存命中状态头（调试用）
        add_header X-Cache-Status $upstream_cache_status;

        proxy_pass http://127.0.0.1:37892;
    }

    # 缩略图 - 长期缓存（不可变）
    location ~* /upload/.*_(300w|600w|1200w)\.(webp|jpg|jpeg|png)$ {
        # 禁止记录日志
        access_log off;

        # 极长期缓存
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";

        # gzip
        gzip on;
        gzip_vary on;
        gzip_types image/webp image/jpeg image/png;
        gzip_min_length 500;

        proxy_pass http://127.0.0.1:37892;
    }

    # 缩略图主文件
    location ~* /upload/.*_thumb\.(webp|jpg|jpeg|png)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        proxy_pass http://127.0.0.1:37892;
    }

    # 静态资源
    location / {
        try_files $uri $uri/ /index.html;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "OK";
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

